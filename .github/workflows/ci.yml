name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      assignment:
        description: Assignment id used to select tests (e.g. SWB-04)
        required: true
        default: SWB-04
      submission:
        description: Submission path (e.g. dev/reference or SWB-04/john-doe)
        required: true
        default: dev/reference

env:
  EDU_ASSIGNMENT: ${{ github.event.inputs.assignment || 'SWB-04' }}
  EDU_SUBMISSION: ${{ github.event.inputs.submission || 'dev/reference' }}
  BUILD_DIR: build-${{ github.event.inputs.submission || 'dev-reference' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cpplint
        run: pip install cpplint

      - name: Run cpplint
        run: ./scripts/lint.sh "$EDU_ASSIGNMENT" ignored "$EDU_SUBMISSION"

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ clang

      - name: Build submission
        run: ./scripts/build.sh "$EDU_ASSIGNMENT" ignored "$EDU_SUBMISSION"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUILD_DIR }}
          path: build/

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.BUILD_DIR }}
          path: build/

      - name: Run Google Test via CTest
        run: |
          test_dir="build/${EDU_SUBMISSION//\//-}"
          ctest --test-dir "$test_dir" --output-on-failure
